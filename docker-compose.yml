services:
  api:
    build: .
    env_file:
      - .env
    ports:
      - "8000:8000"
    restart: unless-stopped

  streamlit:
    image: python:3.12-slim
    working_dir: /app
    env_file:
      - .env
    volumes:
      - ./:/app
    command: >
      sh -c "pip install --no-cache-dir -r requirements.txt &&
             streamlit run streamlit_app.py --server.address 0.0.0.0 --server.port 8501"
    ports:
      - "8501:8501"
    depends_on:
      - api
